<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Gift card artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3a4d"/>
      <stop offset="1" stop-color="#0f161f"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc86b"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#ff9900" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff9900" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="200" fill="url(#bg)"/>
  <rect width="320" height="200" fill="url(#glow)"/>
  <!-- soft pattern -->
  <g fill="#ffffff" opacity=".05">
    <circle cx="40" cy="170" r="60"/><circle cx="300" cy="10" r="46"/>
  </g>
  <!-- confetti -->
  <g opacity=".9">
    <rect x="196" y="38" width="6" height="12" rx="2" fill="#ffd166" transform="rotate(-25 199 44)"/>
    <rect x="286" y="62" width="6" height="12" rx="2" fill="#06d6a0" transform="rotate(30 289 68)"/>
    <rect x="214" y="150" width="6" height="12" rx="2" fill="#ef476f" transform="rotate(15 217 156)"/>
    <circle cx="296" cy="140" r="3.5" fill="#ffd166"/>
    <circle cx="186" cy="92" r="3" fill="#118ab2"/>
    <circle cx="270" cy="34" r="3" fill="#ef476f"/>
  </g>
  <!-- gift box -->
  <g transform="translate(206 70)">
    <ellipse cx="44" cy="104" rx="46" ry="6" fill="#000" opacity=".25"/>
    <rect x="4" y="34" width="80" height="66" rx="6" fill="url(#box)"/>
    <rect x="0" y="22" width="88" height="20" rx="5" fill="url(#lid)"/>
    <rect x="38" y="22" width="12" height="78" fill="#d1495b"/>
    <rect x="4" y="42" width="80" height="5" fill="#000" opacity=".08"/>
    <!-- bow -->
    <path d="M44 22 C30 2 10 8 18 20 C24 28 38 24 44 22 Z" fill="#ef476f"/>
    <path d="M44 22 C58 2 78 8 70 20 C64 28 50 24 44 22 Z" fill="#ef476f"/>
    <circle cx="44" cy="21" r="6" fill="#d1495b"/>
  </g>
</svg>
